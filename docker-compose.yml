services:
  # ---- STEP 1 (active): login needs only the database, the API and the website ----
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: ada, POSTGRES_PASSWORD: ada, POSTGRES_DB: ada}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U ada"], interval: 5s, retries: 10}
  api:
    build: {context: ., dockerfile: infra/docker/api.Dockerfile}
    env_file: .env
    environment: {DATABASE_URL: "postgresql+psycopg://ada:ada@postgres:5432/ada"}   # .env uses localhost for local runs
    command: uvicorn 
    ports: ["8000:8000"]
    depends_on: {postgres: {condition: service_healthy}}
    # STEP 2+: add  redis: {condition: service_started}  to depends_on above
    volumes: ["./apps/api/src:/app/src"]
  web:
    build: {context: ., dockerfile: infra/docker/web.Dockerfile}
    environment: {API_URL: "http://api:8000"}
    ports: ["5173:5173"]

